{% if rows %}
<div class="table-responsive">
    <table class="table align-middle">
        <thead>
        <tr>
            {% for column in rows[0].keys() %}<th>{{ column.replace("_", " ")|title }}</th>{% endfor %}
        </tr>
        </thead>
        <tbody>
        {% for row in rows %}
        <tr>
            {% for value in row.values() %}<td>{{ value if value is not none else "—" }}</td>{% endfor %}
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% else %}
<div class="empty-state"><i class="bi bi-inbox"></i><p>No records found.</p></div>
{% endif %}
